name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Package plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify plugin structure
        run: |
          test -f main.lua || { echo "main.lua missing"; exit 1; }
          test -f _meta.lua || { echo "_meta.lua missing"; exit 1; }

      - name: Stage plugin folder
        run: |
          mkdir -p dist/ink-away.koplugin
          cp -R _meta.lua main.lua ink README.md NOTICE.md LICENSE dist/ink-away.koplugin/

      - name: Package
        run: |
          cd dist
          zip -r ../ink-away.koplugin.zip ink-away.koplugin
          unzip -l ../ink-away.koplugin.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ink-away.koplugin.zip
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
